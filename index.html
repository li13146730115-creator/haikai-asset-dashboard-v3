"rule":"逾期天数=本地日期T－应付日；1—30、31—60、61—90、>90分桶。","page":"风险区","priority":"核心","state":"可计算"},{"code":"F10","group":"账单收缴","name":"本期历史欠费结清","key":"historicalRecovery","unit":"元","kind":"期间净核销流量","formula":"Σ本期生效核销到应付日<S账单的有符号金额","fields":"核销事件日期、账单应付日、金额、反核销、抵扣类型","rule":"含抵扣，故称结清不称现金回款；退款反核销可能令本期值为负。","page":"收缴详情","priority":"核心","state":"可计算"},{"code":"F11","group":"账单收缴","name":"本期应收减免及调减","key":"waived","unit":"元","kind":"同批账单累计至期末","formula":"ΣF01账单max(原应收－净应收,0)","fields":"原应收、净应收、已审批调整","rule":"是本期到期账单的累计净减额，不是期间全部减免事件流量。","page":"收缴详情","priority":"核心","state":"可计算"},{"code":"F12","group":"账单收缴","name":"本期经营费用退款","key":"cashRefund","unit":"元","kind":"期间现金流","formula":"Σ本期实际退款金额绝对值","fields":"已确认退款单、执行时间、原费用/收款关联","rule":"未执行申请不计；押金退款不纳入经营费用退款；为F02的扣减分项。","page":"收缴详情","priority":"核心","state":"可计算"},{"code":"C01","group":"合同签约","name":"本期新签合同数","key":"newContracts","unit":"份","kind":"期间签约","formula":"COUNT DISTINCT 签约日在[S,E]且T时非作废、已审批的新签合同逻辑ID","fields":"合同逻辑ID、签约日、审批/作废时间、合同类型","rule":"排除补充协议/变更版本/续签；本期已终止合同仍属签约流量；起租日在未来也计。","page":"新签详情","priority":"核心","state":"可计算"},{"code":"C02","group":"合同签约","name":"本期新签面积","key":"newArea","unit":"㎡","kind":"期间签约","formula":"ΣC01各合同签约版本关联的租赁空间面积","fields":"合同逻辑ID、签约版本、合同资源面积、面积单位","rule":"每合同内资源去重，跨合同按签约业务流量相加；不等同净吸纳或期末占用。","page":"顶部新签卡 / 主体","priority":"核心","state":"可计算"},{"code":"C03","group":"合同签约","name":"本期新签客户数","key":"newCustomers","unit":"家","kind":"期间签约去重","formula":"COUNT DISTINCT C01合同客户ID","fields":"新签合同客户唯一ID","rule":"指本期新签合同涉及客户，包含历史合作客户；不是首次合作客户数。","page":"顶部新签卡","priority":"核心","state":"可计算"},{"code":"C04","group":"合同签约","name":"本期续签合同数","key":"renewalContracts","unit":"份","kind":"期间签约","formula":"COUNT DISTINCT 本期签署并已审批的续签合同逻辑ID","fields":"签约日、类型、原合同ID、审批/作废时间","rule":"续签与新签分开；补充协议不算续签。","page":"合同详情","priority":"核心","state":"可计算"},{"code":"C05","group":"合同签约","name":"本期续签面积","key":"renewalArea","unit":"㎡","kind":"期间签约","formula":"ΣC04合同签约版本空间面积","fields":"续签合同资源明细、面积单位","rule":"按续签流量汇总，不直接并入期末已出租面积。",
